name: Build and deploy

on:
  push:
    branches: [main]
  # Adding photos to a release doesn't trigger a run, so rebuild hourly to pick
  # them up (or press "Run workflow" in the Actions tab to update straight away).
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Resized copies keyed by content hash, so release photos are only
      # downloaded and resized once rather than on every hourly build.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: build-cache-${{ github.run_id }}
          restore-keys: build-cache-
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
