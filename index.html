<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography Portfolio</title>
<!--OG_META-->
<script>
  // Set the theme before first paint so dark-mode visitors don't see a light flash.
  (function () {
    var theme = 'light';
    try {
      theme = localStorage.getItem('photo-portfolio-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="cfg-fonts" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a href="#" class="brand" id="brand"><span class="l-long" id="brand-long">&nbsp;</span><span class="l-short" id="brand-short"></span> / Film</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"></path></svg>
      <span class="theme-label" id="theme-label">Dark</span>
    </button>
  </header>

  <main>
    <section id="view-index" class="view">
      <div class="intro">
        <div class="intro-name">
          <img id="avatar" class="avatar" alt="" hidden>
          <h1 id="photographer-name" class="display-title">&nbsp;</h1>
        </div>
        <p id="tagline" class="tagline" hidden></p>
      </div>
      <nav id="site-nav" class="site-nav" aria-label="Site"></nav>
      <p id="empty-hint" class="empty-hint" hidden>
        No photos yet &mdash; drop images into <code>images/</code>, then run <code>npm run build</code>.
      </p>
      <div id="gallery" class="grid"></div>
    </section>

    <section id="view-favs" class="view view-favs" hidden>
      <a href="#" class="back-link">&larr; Back to index</a>
      <div class="favs-head">
        <h2 class="display-title page-title" id="favs-title">Favourites</h2>
        <span id="favs-count" class="favs-count"></span>
      </div>
      <div id="favs-gallery" class="grid grid-large"></div>
    </section>

    <section id="view-gear" class="view view-gear" hidden>
      <a href="#" class="back-link">&larr; Back to index</a>
      <div class="gear-head">
        <h2 class="display-title page-title" id="gear-title">Gear</h2>
        <p id="gear-intro" class="gear-intro" hidden></p>
      </div>
      <div id="gear-groups" class="gear-groups"></div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="https://github.com/trentnbauer/PhotographyPortfolio" target="_blank" rel="noopener noreferrer">Designed by Trent Bauer, built by Claude ↗</a><span id="footer-site" class="footer-site"></span>
  </footer>
</div>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-top">
    <span id="lb-count"></span>
    <span class="lb-actions">
      <a id="lb-save" class="lb-save" target="_blank" rel="noopener" aria-label="Save original photo"><span class="l-long">Save</span> <svg class="lb-save-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"></path></svg></a>
      <button id="lb-close" class="lb-close" type="button" aria-label="Close"><span class="l-long">Close</span> <span class="lb-x">&times;</span></button>
    </span>
  </div>
  <div class="lb-stage">
    <button class="lb-arrow lb-side" data-step="-1" type="button" aria-label="Previous photo">&larr;</button>
    <div class="lb-frame">
      <img id="lb-img" class="lb-img" alt="">
      <div id="lb-progress" class="lb-progress" hidden><span></span></div>
    </div>
    <button class="lb-arrow lb-side" data-step="1" type="button" aria-label="Next photo">&rarr;</button>
  </div>
  <div class="lb-bottom">
    <button class="lb-arrow lb-under" data-step="-1" type="button" aria-label="Previous photo">&larr;</button>
    <span id="lb-caption" class="lb-caption"></span>
    <span id="lb-hint" class="lb-hint"></span>
    <button class="lb-arrow lb-under" data-step="1" type="button" aria-label="Next photo">&rarr;</button>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
