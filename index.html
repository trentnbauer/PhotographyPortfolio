<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-row">
      <div class="hero-heading">
        <h1 id="photographer-name" class="hero-title">&nbsp;</h1>
        <p id="tagline" class="hero-tagline" hidden></p>
      </div>
      <div class="hero-actions">
        <nav id="social-row" class="social-row" aria-label="Social links"></nav>
        <button id="gear-toggle" class="gear-toggle" type="button">My Gear</button>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" type="button">
          <span class="theme-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="work" class="gallery-section">
    <p id="empty-hint" class="empty-hint" hidden>
      No photos yet &mdash; drop images into <code>images/</code>, then run <code>npm run build</code>. This placeholder gallery shows what the layout will look like.
    </p>
    <div id="gallery" class="masonry"></div>
  </main>

  <footer class="site-footer">Designed by Trent Bauer, built by Claude</footer>
</div>
<div id="gear-modal" class="gear-modal" hidden>
  <div class="gear-panel">
    <button id="gear-close" class="gear-close" aria-label="Close" type="button">&times;</button>
    <div id="gear-content" class="gear-content"></div>
  </div>
</div>
<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox-close" aria-label="Close" type="button">&times;</button>
  <img id="lightbox-img" class="lightbox-img" alt="">
  <div id="lightbox-spinner" class="lightbox-spinner" hidden></div>
  <div id="lightbox-caption" class="lightbox-caption" hidden></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
